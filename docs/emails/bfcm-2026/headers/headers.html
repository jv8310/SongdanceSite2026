<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@1,400;1,500;1,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EADFCB;padding:30px;font-family:Figtree,sans-serif}
.lab{font:600 12px Figtree;letter-spacing:2px;text-transform:uppercase;color:#7A6A78;margin:26px 0 8px}
.h{position:relative;width:600px;height:320px;overflow:hidden;background:#2A1B2A}
.h .ph{position:absolute;inset:0;background-size:cover}
.h .scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(42,27,42,.94) 0%,rgba(42,27,42,.82) 38%,rgba(74,37,64,.35) 68%,rgba(74,37,64,.05) 100%)}
.h .wave{position:absolute;left:0;right:0;bottom:-6px;height:44px;opacity:.55}
.h .txt{position:absolute;left:38px;top:34px;width:350px}
.eye{font:600 10.5px Figtree;letter-spacing:2.4px;text-transform:uppercase;color:#E08B63;margin:0 0 16px}
.eye i{display:inline-block;width:22px;height:1px;background:#E08B63;vertical-align:middle;margin-right:10px}
.t{font:400 37px/1.1 Spectral,serif;color:#F4ECDF;margin:0 0 14px}
.t em{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:1.06em;color:#EBC9B5}
.s{font:400 13.5px/1.55 Figtree;color:#EADFCB;margin:0}
.s b{font-weight:600;color:#fff}
.until{position:absolute;left:38px;bottom:46px;font:600 10.5px Figtree;letter-spacing:2px;text-transform:uppercase;color:#C9B4C3}
.seal{position:absolute;right:34px;top:36px;width:150px;height:150px;border-radius:50%;background:#C9603A;box-shadow:0 10px 30px rgba(15,8,14,.45);transform:rotate(-8deg);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#F4ECDF}
.seal:before{content:"";position:absolute;inset:7px;border-radius:50%;border:1px solid rgba(244,236,223,.6)}
.seal .n{font:400 58px/0.95 Spectral,serif;letter-spacing:-1px}
.seal .n sup{font-size:.5em;vertical-align:.62em;margin-left:1px}
.seal .o{font:600 11px Figtree;letter-spacing:3px;text-transform:uppercase;margin-top:6px}
.seal .w{font:italic 500 15px 'Cormorant Garamond',serif;margin-top:3px;color:#F2DCC9}
.seal.two{right:22px;top:168px;width:112px;height:112px;background:#F4ECDF;color:#4A2540;transform:rotate(7deg)}
.seal.two:before{border-color:rgba(74,37,64,.45);inset:6px}
.seal.two .n{font-size:38px}
.seal.two .o{font-size:9px;letter-spacing:2.2px;margin-top:4px}
.seal.two .w{color:#A14826;font-size:13.5px}
/* variant 2: paper */
.p{position:relative;width:600px;height:250px;background:#F4ECDF;overflow:hidden}
.p .bar{background:#2A1B2A;color:#F4ECDF;font:600 10.5px Figtree;letter-spacing:2.2px;text-transform:uppercase;text-align:center;padding:11px}
.p .txt{position:absolute;left:40px;top:74px;width:330px}
.p .eye{color:#A14826}.p .eye i{background:#A14826}
.p .t{color:#2A1B2A;font-size:38px}.p .t em{color:#C9603A}
.p .s{color:#4A3848}.p .s b{color:#2A1B2A}
.p .seal{top:66px;right:40px;box-shadow:0 8px 22px rgba(74,37,64,.25)}
.p svg{position:absolute;left:0;right:0;bottom:0;opacity:.6}
.p{height:270px}
.p .seal.two{top:150px;right:22px}
.p .seal:not(.two){right:70px;top:58px}
.h .t em,.p .t em{display:block}
.p .txt{width:390px}.p .t{font-size:34px}
.p2 .seal:not(.two){right:104px;top:50px}.p2 .seal.two{right:16px;top:146px}
</style></head><body>
<!--HEADERS-->
</body></html>
